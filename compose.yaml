services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      APP_DB_URL: jdbc:mysql://db:3306/campus_events
      APP_DB_USER: ${MYSQL_USER}
      APP_DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS http://localhost:8080/actuator/health || exit 1',
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
  frontend:
    environment:
      BACKEND_URL: http://backend:8080
    develop:
      watch:
        - action: rebuild
          path: ./frontend
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
