spring.application.name=eventmanagement
spring.web.error.include-message=always

# DUMMY dev secret, 40 bytes (HS256 needs >= 32). Replace at deployment via APP_JWT_SECRET
app.jwt.secret=dev-only-dummy-secret-change-at-deploy-40b

# JWT time to live in seconds (default: 8 hours)
app.jwt.ttl-seconds=28800

# switch to true in production to ensure cookies are only sent over HTTPS
app.cookie.secure=false

# CORS configuration (allow local development server to access the backend)
# todo: update in production to only allow the frontend domain
app.cors.allowed-origins=http://localhost:5173


# logging: console + file under target/ (gitignored, wiped by mvn clean)
logging.file.name=target/logs/event.log
logging.level.com.events.eventmanagement=DEBUG
