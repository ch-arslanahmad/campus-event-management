spring.application.name=eventmanagement
spring.web.error.include-message=always

# DUMMY dev secret, 40 bytes (HS256 needs >= 32). Replace at deployment via APP_JWT_SECRET
app.jwt.secret=${APP_JWT_SECRET:dev-only-dummy-secret-change-at-deploy-40b}

# JWT time to live in seconds (default: 8 hours)
app.jwt.ttl-seconds=28800

# switch to true in production to ensure cookies are only sent over HTTPS
app.cookie.secure=false

# CORS configuration (allow local development server to access the backend)
# todo: update in production to only allow the frontend domain
app.cors.allowed-origins=http://localhost:5173


# logging: console + file under target/ (gitignored, wiped by mvn clean)
logging.file.name=target/logs/event.log
logging.level.com.events.eventmanagement=DEBUG

# database setup, schema loading and the APP_DB_* overrides: documentation/SETUP.md
spring.datasource.url=${APP_DB_URL:jdbc:mysql://localhost:3306/campus_events}
spring.datasource.username=${APP_DB_USER:campus}
spring.datasource.password=${APP_DB_PASSWORD:campus123}

# backend/database/schema.sql owns the schema, Hibernate never runs DDL
spring.jpa.hibernate.ddl-auto=none

# entities are mapped to DTOs before serialization, nothing lazy in a view
spring.jpa.open-in-view=false

# the dialect is pinned instead of auto-detected: detection reads MySQL 8
# metadata that some engines do not expose, and startup then dies with
# "Unable to determine Dialect". Set APP_DB_DIALECT to override it.
spring.jpa.properties.hibernate.dialect=${APP_DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# SQL under DEBUG when hunting a data bug
logging.level.org.hibernate.SQL=INFO
